name: Collector checks
on:
  push:
    paths: ['collector/**', '.github/workflows/collector-tests.yml']
  pull_request:
    paths: ['collector/**', '.github/workflows/collector-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s collector -v
      - name: Build NAS image
        if: runner.os == 'Linux'
        run: docker build -t vion-collector-test collector
      - name: Check container readiness
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run -d --name vion-collector-test -p 127.0.0.1:18790:8790 vion-collector-test
          trap 'docker logs vion-collector-test; docker rm -f vion-collector-test' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18790/health; then exit 0; fi
            sleep 1
          done
          exit 1
