services:
  vion-collector:
    build: .
    restart: unless-stopped
    ports:
      - "${VION_BIND_ADDRESS:-0.0.0.0}:8790:8790"
    volumes:
      - vion-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  vion-data:
